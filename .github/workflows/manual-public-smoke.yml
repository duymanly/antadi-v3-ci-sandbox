name: Public synthetic CI smoke

# Only fictional, standalone code. Do NOT checkout the private Antadi repo.
# Automate small safe changes on main; no PR events, secrets, or deployment.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/manual-public-smoke.yml'
      - 'src/**'
      - 'tests/**'
      - 'package.json'

permissions:
  contents: read

concurrency:
  group: public-synthetic-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node24-browser-sqlite:
    if: github.repository == 'duymanly/antadi-v3-ci-sandbox'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CI: 'true'
    steps:
      - name: Checkout synthetic sandbox only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check pinned Playwright CLI
        run: |
          test -x ./node_modules/.bin/playwright
          test "$(./node_modules/.bin/playwright --version)" = "Version 1.64.0"
      - name: Install Chromium on standard runner
        run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Test standalone public-only Node24 SQLite Chromium contracts
        run: npm run test:all
      - name: Report strictly synthetic scope
        if: always()
        run: |
          echo 'Only independent fictional records were tested; this does not validate Antadi V3 private code, production prices, login, live Cloudflare D1, or employee access.' >> "$GITHUB_STEP_SUMMARY"
