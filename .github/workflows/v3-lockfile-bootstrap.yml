name: Antadi V3 QA Lockfile Bootstrap

on:
  workflow_dispatch:

jobs:
  lockfile-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Create deterministic candidate lockfile
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify lockfile dependency pins
        run: |
          node --input-type=module <<'NODE'
          import {readFile} from 'node:fs/promises';
          const lock = JSON.parse(await readFile('package-lock.json','utf8'));
          const deps = lock.packages['node_modules'];
          for (const [pkg, expected] of [['node_modules/jose','6.2.12'],['node_modules/playwright','1.64.0']]) {
            const actual = lock.packages[pkg]?.version;
            if (actual !== expected) throw new Error(`${pkg}_VERSION_MISMATCH:${actual}`);
          }
          console.log('LOCKFILE_PIN_CHECK_PASS');
          NODE

      - name: Upload generated lockfile for review
        uses: actions/upload-artifact@v4
        with:
          name: antadi-v3-package-lock-bootstrap
          path: package-lock.json
