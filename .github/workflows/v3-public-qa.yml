name: Antadi V3 Public QA Adapter

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  public-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install QA dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Verify pinned QA dependencies
        run: |
          node --input-type=module <<'NODE'
          import {readFile} from 'node:fs/promises';
          for (const [pkg, expected] of [['jose','6.2.12'],['playwright','1.64.0']]) {
            const actual = JSON.parse(await readFile(`node_modules/${pkg}/package.json`,'utf8')).version;
            if (actual !== expected) throw new Error(`${pkg}_VERSION_MISMATCH:${actual}`);
          }
          NODE

      - name: Verify Node runtime
        run: |
          node -e "if (process.versions.node.split('.')[0] !== '24') process.exit(1); console.log(process.version)"

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify Chromium executable
        run: |
          node --input-type=module <<'NODE'
          import {chromium} from 'playwright';
          const path = chromium.executablePath();
          console.log(path);
          if (!path) throw new Error('CHROMIUM_EXECUTABLE_MISSING');
          NODE

      - name: Run V3 QA contract
        run: npm run qa:v3:all

      - name: Run browser QA
        run: npm run test:browser

      - name: Generate QA summary
        if: always()
        run: |
          mkdir -p qa-artifacts
          {
            echo 'Antadi V3 Public QA Adapter'
            echo "Commit: $GITHUB_SHA"
            echo "Node: $(node --version)"
          } > qa-artifacts/summary.txt

      - name: Upload QA summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: antadi-v3-public-qa-summary
          path: qa-artifacts/summary.txt
