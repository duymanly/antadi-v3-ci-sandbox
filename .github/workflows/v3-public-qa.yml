name: Antadi V3 Public QA Adapter

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: antadi-v3-public-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-qa:
    if: github.repository == 'duymanly/antadi-v3-ci-sandbox'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install QA dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify pinned QA dependencies
        run: |
          node --input-type=module <<'NODE'
          import {readFile, access} from 'node:fs/promises';
          import {constants} from 'node:fs';
          const lock = JSON.parse(await readFile('package-lock.json','utf8'));
          for (const [pkg, expected] of [['jose','6.2.12'],['playwright','1.64.0']]) {
            const actual = JSON.parse(await readFile(`node_modules/${pkg}/package.json`,'utf8')).version;
            if (actual !== expected || lock.packages[`node_modules/${pkg}`]?.version !== expected)
              throw new Error(`${pkg}_VERSION_MISMATCH:${actual}`);
          }
          for (const [pkg, command] of [['playwright','playwright'],['playwright-core','playwright-core']]) {
            if (lock.packages[`node_modules/${pkg}`]?.bin?.[command] !== 'cli.js')
              throw new Error(`LOCKFILE_MISSING_CLI_BIN:${pkg}`);
          }
          await access('node_modules/.bin/playwright', constants.X_OK);
          console.log('LOCAL_PLAYWRIGHT_CLI_READY');
          NODE
          ./node_modules/.bin/playwright --version

      - name: Verify Node runtime
        run: |
          node -e "if (process.versions.node.split('.')[0] !== '24') process.exit(1); console.log(process.version)"

      - name: Install Chromium
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Verify Chromium executable
        run: |
          node --input-type=module <<'NODE'
          import {chromium} from 'playwright';
          const path = chromium.executablePath();
          console.log(path);
          if (!path) throw new Error('CHROMIUM_EXECUTABLE_MISSING');
          NODE

      - name: Run V3 QA contract
        run: npm run qa:v3:all

      - name: Run browser QA
        run: npm run test:browser

      - name: Generate QA summary
        if: always()
        run: |
          mkdir -p qa-artifacts
          {
            echo 'Antadi V3 Public QA Adapter'
            echo "Commit: $GITHUB_SHA"
            echo "Node: $(node --version)"
          } > qa-artifacts/summary.txt

      - name: Upload QA summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: antadi-v3-public-qa-summary
          path: qa-artifacts/summary.txt
